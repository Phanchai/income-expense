<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
<meta name="theme-color" content="#f6f5f1">
<title>บันทึกรายรับรายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --muted:#77756e; --line:#e6e3dc;
    --inc:#1f8a5b; --inc-bg:#e5f4ec; --exp:#c8452f; --exp-bg:#fbe9e5; --acc:#2d4bd8; --acc-bg:#e8ecff;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#161614; --card:#21211e; --ink:#eeede8; --muted:#9a988f; --line:#33322e;
      --inc:#4cc38a; --inc-bg:#1d3329; --exp:#f0765f; --exp-bg:#3a2420; --acc:#7f95ff; --acc-bg:#262b45; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 48px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:23px;margin:0;font-weight:700}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  select,input,button{font:inherit;color:inherit}
  .yearbox{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
  .yearbox button{border:0;background:none;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px;color:var(--muted)}
  .yearbox button:hover{background:var(--bg);color:var(--ink)}
  .yearbox .y{min-width:92px;text-align:center;font-weight:600}
  .months{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:thin}
  .months button{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted);position:relative}
  .months button.has::after{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
  .months button.now{border-color:var(--acc);color:var(--acc)}
  .months button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .months button.on::after{background:var(--bg)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat .l{font-size:13px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat.inc .v{color:var(--inc)} .stat.exp .v{color:var(--exp)}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:16px;margin:0 0 12px;font-weight:600}
  .toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:12px}
  .toggle button{border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
  .toggle button.on.inc{background:var(--inc-bg);color:var(--inc)}
  .toggle button.on.exp{background:var(--exp-bg);color:var(--exp)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .f:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .amt{font-size:20px;font-weight:600}
  .rep{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink);cursor:pointer}
  .rep input{width:18px;height:18px;accent-color:var(--acc)}
  #repN{margin-top:6px}
  .btn{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
  .btn:hover{opacity:.9}
  .err{color:var(--exp);font-size:13px;margin-top:8px;min-height:1em}
  .list{display:flex;flex-direction:column}
  .day{font-size:12px;color:var(--muted);margin:14px 0 4px;font-weight:600}
  .day:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
  .row.inc .dot{background:var(--inc-bg)} .row.exp .dot{background:var(--exp-bg)}
  .meta{flex:1;min-width:0}
  .meta .c{font-weight:500}
  .meta .n{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--acc-bg);color:var(--acc);margin-left:6px;vertical-align:1px;font-weight:500}
  .amtc{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.inc .amtc{color:var(--inc)} .row.exp .amtc{color:var(--exp)}
  .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px;border-radius:6px;opacity:.5}
  .del:hover{opacity:1;background:var(--bg);color:var(--exp)}
  .empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px}
  .bars{display:flex;flex-direction:column;gap:10px}
  .bar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
  .fill{height:100%;background:var(--exp);border-radius:4px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{border:1px solid var(--line);background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
  .tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .status{font-size:12px;color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:16px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn2{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:500}
  .btn2:hover{background:var(--bg)}
  .year{margin-top:16px}
  .tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  .tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--bg)}
  .tbl tr.on td{background:var(--acc-bg)}
  .tbl .i{color:var(--inc)} .tbl .e{color:var(--exp)} .tbl .neg{color:var(--exp)} .tbl .z{color:var(--muted)}
  .tbl tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}
  .tblwrap{overflow-x:auto}
  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .stat.bal{grid-column:1/-1}
    .stat .v{font-size:21px}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>💰 บันทึกรายรับรายจ่าย</h1>
      <div class="sub" id="status">กำลังโหลด…</div>
    </div>
    <div class="yearbox">
      <button id="yPrev" aria-label="ปีก่อนหน้า">‹</button>
      <div class="y" id="yLabel"></div>
      <button id="yNext" aria-label="ปีถัดไป">›</button>
    </div>
  </header>

  <div class="months" id="months"></div>

  <div class="stats">
    <div class="stat inc"><div class="l" id="lInc">รายรับ</div><div class="v" id="sInc">฿0</div></div>
    <div class="stat exp"><div class="l" id="lExp">รายจ่าย</div><div class="v" id="sExp">฿0</div></div>
    <div class="stat bal"><div class="l" id="lBal">คงเหลือ</div><div class="v" id="sBal">฿0</div></div>
  </div>

  <div class="grid">
    <div class="stack">
      <form class="card" id="form" autocomplete="off">
        <h2>เพิ่มรายการ</h2>
        <div class="toggle">
          <button type="button" data-t="exp" class="exp on">รายจ่าย</button>
          <button type="button" data-t="inc" class="inc">รายรับ</button>
        </div>
        <label for="amount">จำนวนเงิน (บาท)</label>
        <input class="f amt" id="amount" inputmode="decimal" placeholder="0.00">
        <label for="cat">หมวดหมู่</label>
        <select class="f" id="cat"></select>
        <label for="date">วันที่</label>
        <input class="f" id="date" type="date">
        <label for="note">หมายเหตุ (ไม่บังคับ)</label>
        <input class="f" id="note" maxlength="120" placeholder="เช่น ค่าเช่าห้อง">
        <label class="rep"><input type="checkbox" id="rep"> ทำซ้ำทุกเดือน (วางแผนล่วงหน้า)</label>
        <select class="f" id="repN" hidden>
          <option value="eoy">ถึงสิ้นปีนี้</option>
          <option value="3">3 เดือน</option>
          <option value="6">6 เดือน</option>
          <option value="12" selected>12 เดือน</option>
          <option value="24">24 เดือน</option>
          <option value="36">36 เดือน</option>
        </select>
        <button class="btn" type="submit" id="saveBtn">บันทึก</button>
        <div class="err" id="err"></div>
      </form>

      <div class="card">
        <h2 id="barsTitle">รายจ่ายตามหมวดหมู่</h2>
        <div class="bars" id="bars"></div>
      </div>

      <div class="card">
        <h2>สำรองข้อมูล (JSON)</h2>
        <div class="btns">
          <button type="button" class="btn2" id="exportBtn">⬇️ ส่งออก JSON</button>
          <button type="button" class="btn2" id="importBtn">⬆️ นำเข้า JSON</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <div class="status" id="ioMsg" style="margin-top:8px">ควรส่งออกไฟล์เก็บไว้เป็นระยะ</div>
      </div>
    </div>

    <div class="card">
      <h2 id="listTitle">รายการ</h2>
      <div class="tabs" id="tabs">
        <button data-f="all" class="on">ทั้งหมด</button>
        <button data-f="inc">รายรับ</button>
        <button data-f="exp">รายจ่าย</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <div class="card year">
    <h2 id="yearTitle">ภาพรวมทั้งปี</h2>
    <div class="tblwrap">
      <table class="tbl">
        <thead><tr><th>เดือน</th><th>รายรับ</th><th>รายจ่าย</th><th>คงเหลือ</th><th class="hide-sm">สะสม</th></tr></thead>
        <tbody id="yBody"></tbody>
        <tfoot id="yFoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<script>
const CATS = {
  inc: [["เงินเดือน","💼"],["รายได้เสริม","🧩"],["ขายของ","🛍️"],["ดอกเบี้ย/ปันผล","📈"],["ได้รับเงินโอน","🎁"],["อื่นๆ","➕"]],
  exp: [["อาหาร/เครื่องดื่ม","🍜"],["เดินทาง","🚗"],["ที่พัก/ค่าเช่า","🏠"],["ค่าน้ำ/ไฟ/เน็ต","💡"],["ผ่อนชำระ/บัตรเครดิต","💳"],["ช้อปปิ้ง","🛒"],["สุขภาพ","💊"],["บันเทิง","🎬"],["การศึกษา","📚"],["ครอบครัว","👨‍👩‍👧"],["ออมเงิน/ลงทุน","🏦"],["อื่นๆ","📦"]]
};
const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const LS_KEY = "income-expense-v1";
const IN_FRAME = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const $ = id => document.getElementById(id);

let items = [];          // {id,type,amount,cat,date,note,ts,rid?}
let type = "exp";
let filter = "all";
const NOW = new Date();
let year = NOW.getFullYear();
let mon = NOW.getMonth()+1;   // 1-12, or 0 = whole year
let col = null;

const pad = n => String(n).padStart(2,"0");
function todayStr(){ return NOW.getFullYear()+"-"+pad(NOW.getMonth()+1)+"-"+pad(NOW.getDate()); }
function fmt(n){ return "฿"+n.toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2}); }
function sfmt(n){ return (n<0?"-":"")+fmt(Math.abs(n)); }
function icon(t,c){ const f=CATS[t].find(x=>x[0]===c); return f?f[1]:"•"; }
function esc(s){ return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function thDate(s){ const [y,m,d]=s.split("-").map(Number); return d+" "+MONTHS[m-1]+" "+(y+543); }
function newId(){ return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function sum(arr,t){ return arr.filter(x=>x.type===t).reduce((a,b)=>a+b.amount,0); }
function r2(n){ return Math.round(n*100)/100; }

/* ---------- storage ---------- */
function lsLoad(){ try{ const v=JSON.parse(localStorage.getItem(LS_KEY)||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(items)); }catch(e){} }
function setStatus(t){ $("status").textContent=t; }

async function initDb(){
  if(typeof claude==="undefined"){ setStatus("บันทึกไว้ในเบราว์เซอร์เครื่องนี้"); return; }
  let timer = setTimeout(()=>setStatus("ยังเชื่อมต่อที่เก็บข้อมูลไม่ได้ — ข้อมูลอาจไม่เป็นปัจจุบัน"), 10000);
  try{
    const db = await claude.use("db");
    const user = await claude.use("user");
    const uid = user ? await user.id() : null;
    if(!db || !uid){ clearTimeout(timer); setStatus("บันทึกไว้ในเบราว์เซอร์เครื่องนี้"); return; }
    col = db.collection("data/users/"+uid);
    col.onSnapshot(snap=>{
      items = snap.docs.map(d=>d.data()).filter(x=>x && x.id);
      lsSave(); render();
      if(!snap.metadata.fromCache){ clearTimeout(timer); setStatus("ข้อมูลส่วนตัว บันทึกอัตโนมัติ ✓"); }
    }, e=>{ clearTimeout(timer); col=null; setStatus("บันทึกไว้ในเบราว์เซอร์เครื่องนี้"); });
  }catch(e){ clearTimeout(timer); col=null; setStatus("บันทึกไว้ในเบราว์เซอร์เครื่องนี้"); }
}

async function addItems(list){
  items.push(...list); lsSave(); render();
  if(col){ for(const it of list){ try{ await col.doc(it.id).set(it); }catch(e){ handleWriteErr(e); break; } } }
}
async function delItems(ids){
  const s=new Set(ids); items=items.filter(x=>!s.has(x.id)); lsSave(); render();
  if(col){ for(const id of ids){ try{ await col.doc(id).delete(); }catch(e){ handleWriteErr(e); break; } } }
}
function handleWriteErr(e){
  if(e && e.code==="quota_exceeded") $("err").textContent="พื้นที่เก็บข้อมูลเต็ม ลองลบรายการเก่าออกบ้าง";
  else { col=null; setStatus("บันทึกไว้ในเบราว์เซอร์เครื่องนี้"); }
}

/* ---------- render ---------- */
function fillCats(){ $("cat").innerHTML = CATS[type].map(([c,i])=>`<option value="${esc(c)}">${i} ${esc(c)}</option>`).join(""); }

function render(){
  const yp = String(year);
  const inYear = items.filter(x=>x.date.startsWith(yp+"-"));
  const curYM = NOW.getFullYear()+"-"+pad(NOW.getMonth()+1);

  // year + month tabs
  $("yLabel").textContent = "พ.ศ. "+(year+543);
  const has = new Set(inYear.map(x=>x.date.slice(5,7)));
  $("months").innerHTML = `<button data-m="0" class="${mon===0?"on":""}">ทั้งปี</button>` +
    MS.map((m,i)=>{ const mm=pad(i+1); const cls=[mon===i+1?"on":"", has.has(mm)?"has":"", yp+"-"+mm===curYM?"now":""].join(" ");
      return `<button data-m="${i+1}" class="${cls}">${m}</button>`; }).join("");
  const onBtn=$("months").querySelector(".on"); if(onBtn) onBtn.scrollIntoView({block:"nearest",inline:"center"});

  // selected period
  const period = mon===0 ? inYear : inYear.filter(x=>x.date.slice(5,7)===pad(mon));
  const pName = mon===0 ? "ปี "+(year+543) : MONTHS[mon-1]+" "+(year+543);
  const inc=sum(period,"inc"), exp=sum(period,"exp"), bal=inc-exp;
  $("lInc").textContent="รายรับ · "+pName; $("lExp").textContent="รายจ่าย · "+pName; $("lBal").textContent="คงเหลือ · "+pName;
  $("sInc").textContent=fmt(inc); $("sExp").textContent=fmt(exp);
  $("sBal").textContent=sfmt(bal); $("sBal").style.color = bal<0?"var(--exp)":"var(--ink)";
  $("listTitle").textContent="รายการ · "+pName;
  $("barsTitle").textContent="รายจ่ายตามหมวดหมู่ · "+pName;

  // list
  const shown = period.filter(x=>filter==="all"||x.type===filter).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  if(!shown.length){ $("list").innerHTML=`<div class="empty">ยังไม่มีรายการ — เพิ่มรายการหรือวางแผนล่วงหน้าได้เลย</div>`; }
  else{
    let html="", last="";
    for(const x of shown){
      if(x.date!==last){ html+=`<div class="day">${thDate(x.date)}</div>`; last=x.date; }
      html+=`<div class="row ${x.type}">
        <div class="dot">${icon(x.type,x.cat)}</div>
        <div class="meta"><div class="c">${esc(x.cat)}${x.rid?`<span class="tag">ทุกเดือน</span>`:""}</div>${x.note?`<div class="n">${esc(x.note)}</div>`:""}</div>
        <div class="amtc">${x.type==="inc"?"+":"-"}${fmt(x.amount)}</div>
        <button class="del" data-id="${esc(x.id)}" title="ลบ" aria-label="ลบรายการ">×</button>
      </div>`;
    }
    $("list").innerHTML=html;
  }

  // category bars
  const by={}; period.filter(x=>x.type==="exp").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("bars").innerHTML = !cats.length ? `<div class="empty" style="padding:12px 0">ยังไม่มีรายจ่าย</div>` :
    cats.map(([c,v])=>`<div class="bar">
      <div class="top"><span>${icon("exp",c)} ${esc(c)}</span><span>${fmt(v)} · ${Math.round(v/exp*100)}%</span></div>
      <div class="track"><div class="fill" style="width:${(v/cats[0][1]*100).toFixed(1)}%"></div></div></div>`).join("");

  // year table
  $("yearTitle").textContent="ภาพรวมทั้งปี "+(year+543);
  let cum=0, rows="";
  for(let m=1;m<=12;m++){
    const p=inYear.filter(x=>x.date.slice(5,7)===pad(m));
    const i=sum(p,"inc"), e=sum(p,"exp"), b=i-e; cum+=b;
    const empty=!p.length;
    rows+=`<tr data-m="${m}" class="${mon===m?"on":""}">
      <td>${MONTHS[m-1]}</td>
      <td class="${i?"i":"z"}">${i?fmt(i):"–"}</td>
      <td class="${e?"e":"z"}">${e?fmt(e):"–"}</td>
      <td class="${empty?"z":b<0?"neg":""}">${empty?"–":sfmt(b)}</td>
      <td class="hide-sm ${cum<0?"neg":""}">${sfmt(cum)}</td></tr>`;
  }
  $("yBody").innerHTML=rows;
  const ti=sum(inYear,"inc"), te=sum(inYear,"exp");
  $("yFoot").innerHTML=`<tr><td>รวมทั้งปี</td><td class="i">${fmt(ti)}</td><td class="e">${fmt(te)}</td><td class="${ti-te<0?"neg":""}">${sfmt(ti-te)}</td><td class="hide-sm"></td></tr>`;
}

/* ---------- events ---------- */
document.querySelectorAll(".toggle button").forEach(b=>b.onclick=()=>{
  type=b.dataset.t;
  document.querySelectorAll(".toggle button").forEach(x=>x.classList.toggle("on",x===b));
  fillCats();
});
function selectMonth(m){
  mon=m; render();
  // default the form date into the selected month
  if(m>0){ const d=(year===NOW.getFullYear()&&m===NOW.getMonth()+1)?NOW.getDate():1; $("date").value=year+"-"+pad(m)+"-"+pad(d); }
}
$("months").onclick=e=>{ const b=e.target.closest("button"); if(b) selectMonth(+b.dataset.m); };
$("yBody").onclick=e=>{ const r=e.target.closest("tr"); if(r){ selectMonth(+r.dataset.m); window.scrollTo({top:0,behavior:"smooth"}); } };
$("yPrev").onclick=()=>{ year--; selectMonth(mon); };
$("yNext").onclick=()=>{ year++; selectMonth(mon); };
$("tabs").onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
  filter=b.dataset.f; [...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b)); render(); };
$("rep").onchange=()=>{ $("repN").hidden=!$("rep").checked; $("saveBtn").textContent=$("rep").checked?"บันทึกทุกเดือน":"บันทึก"; };

$("list").onclick=e=>{ const b=e.target.closest(".del"); if(!b) return;
  const it=items.find(x=>x.id===b.dataset.id); if(!it) return;
  if(b.dataset.confirm){
    if(it.rid && b.dataset.confirm==="all") delItems(items.filter(x=>x.rid===it.rid && x.date>=it.date).map(x=>x.id));
    else delItems([it.id]);
    return;
  }
  if(it.rid){
    // offer: this month only, or this + following months
    const box=document.createElement("span");
    box.innerHTML=`<button class="del" data-id="${esc(it.id)}" data-confirm="one" style="opacity:1;font-size:12px">ลบเดือนนี้</button><button class="del" data-id="${esc(it.id)}" data-confirm="all" style="opacity:1;font-size:12px;color:var(--exp)">ลบเดือนนี้+ต่อจากนี้</button>`;
    b.replaceWith(box);
    setTimeout(()=>{ if(box.isConnected) render(); },4000);
  } else {
    b.dataset.confirm="one"; b.textContent="ลบ?"; b.style.opacity=1; b.style.fontSize="13px";
    setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent="×"; b.style.cssText=""; } },2500);
  }
};

$("form").onsubmit=e=>{
  e.preventDefault();
  const amount = parseFloat($("amount").value.replace(/,/g,""));
  if(!(amount>0)){ $("err").textContent="กรุณาใส่จำนวนเงินที่มากกว่า 0"; $("amount").focus(); return; }
  const date = $("date").value || todayStr();
  $("err").textContent="";
  const base={type,amount:r2(amount),cat:$("cat").value,note:$("note").value.trim()};
  const list=[];
  if($("rep").checked){
    const [y0,m0,d0]=date.split("-").map(Number);
    const n = $("repN").value==="eoy" ? 13-m0 : +$("repN").value;
    const rid="r"+Date.now().toString(36);
    for(let k=0;k<n;k++){
      const t=new Date(y0,m0-1+k,1); const yy=t.getFullYear(), mm=t.getMonth()+1;
      const dd=Math.min(d0,new Date(yy,mm,0).getDate());
      list.push({id:newId()+k,...base,date:yy+"-"+pad(mm)+"-"+pad(dd),ts:Date.now()+k,rid});
    }
  } else list.push({id:newId(),...base,date,ts:Date.now()});
  const [ny,nm]=date.split("-").map(Number);
  year=ny; if(mon!==0) mon=nm;
  addItems(list);
  if(list.length>1) $("err").innerHTML=`<span style="color:var(--inc)">เพิ่ม ${list.length} เดือนแล้ว ✓</span>`;
  $("amount").value=""; $("note").value=""; $("amount").focus();
};

/* ---------- JSON export / import ---------- */
function exportJson(){ return JSON.stringify({app:"income-expense",version:1,exportedAt:new Date().toISOString(),items},null,2); }
if(IN_FRAME) $("exportBtn").textContent="📋 คัดลอก JSON";
$("exportBtn").onclick=async()=>{
  const text=exportJson();
  if(IN_FRAME){
    try{ await navigator.clipboard.writeText(text); $("ioMsg").textContent="คัดลอก "+items.length+" รายการแล้ว นำไปวางในไฟล์ .json ได้เลย"; }
    catch(e){ $("ioMsg").textContent="คัดลอกไม่สำเร็จ"; }
    return;
  }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="income-expense-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $("ioMsg").textContent="ส่งออก "+items.length+" รายการแล้ว";
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const parsed=JSON.parse(await file.text());
    const arr=Array.isArray(parsed)?parsed:parsed.items;
    if(!Array.isArray(arr)) throw 0;
    const valid=arr.filter(x=>x&&typeof x.id==="string"&&/^[A-Za-z0-9_.~:@+-]{1,100}$/.test(x.id)&&(x.type==="inc"||x.type==="exp")
      &&typeof x.amount==="number"&&x.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))
      .map(x=>{ const o={id:x.id,type:x.type,amount:x.amount,cat:String(x.cat||"อื่นๆ"),date:x.date,note:String(x.note||""),ts:Number(x.ts)||0};
        if(typeof x.rid==="string") o.rid=x.rid; return o; });
    const have=new Set(items.map(x=>x.id));
    const fresh=valid.filter(x=>!have.has(x.id));
    await addItems(fresh);
    $("ioMsg").textContent="นำเข้า "+fresh.length+" รายการ"+(valid.length-fresh.length?" (ข้าม "+(valid.length-fresh.length)+" รายการที่มีอยู่แล้ว)":"");
  }catch(err){ $("ioMsg").textContent="ไฟล์ไม่ถูกต้อง ต้องเป็นไฟล์ JSON ที่ส่งออกจากโปรแกรมนี้"; }
};

fillCats();
$("date").value=todayStr();
items = lsLoad();
render();
initDb();
</script>
</body>
